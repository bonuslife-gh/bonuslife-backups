name: Keep-alive de staging

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Cliente de Postgres
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Latido en la base de staging (escritura real, sólo en heartbeats)
        env:
          DATABASE_URL: ${{ secrets.STAGING_KEEPALIVE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qtA \
            -c 'INSERT INTO heartbeats DEFAULT VALUES' \
            -c "DELETE FROM heartbeats WHERE beat_at < now() - interval '30 days'" > /dev/null || {
            echo "::error::Staging no respondió: si está pausado, restaurarlo desde Supabase y revisar el keep-alive."
            exit 1
          }
          echo "Latido escrito en staging."
      - name: Salud de la app de staging (Vercel + base con el rol de la app)
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          SALUD_TOKEN: ${{ secrets.SALUD_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 20 -H "x-salud-token: $SALUD_TOKEN" "$STAGING_URL/api/salud" \
            | jq -e '.db == "ok"' > /dev/null || { echo "::error::La app de staging no confirmó la base."; exit 1; }
          echo "La app de staging respondió con la base ok."
      - name: Commit de latido
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > latido.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latido.txt
          git commit -q -m "chore: latido $(date -u +%F)"
          git push -q
