name: Keep-alive de staging

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Cliente de Postgres
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: SELECT 1 en staging con el rol sin permisos
        env:
          DATABASE_URL: ${{ secrets.STAGING_KEEPALIVE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qtAc 'SELECT 1' > /dev/null
          echo "Staging respondió."
      - name: Commit de latido
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > latido.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latido.txt
          git commit -q -m "chore: latido $(date -u +%F)"
          git push -q
